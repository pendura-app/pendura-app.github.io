<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendura</title>
<style>
:root { color-scheme: light dark; --text: #141516; --muted: #62666D; --faint: #9A9DA3; --bg: #F3F3F1; --surface: #FFFFFF; --accent: #2D4A41; --line: rgba(20, 21, 22, 0.08); }
@media (prefers-color-scheme: dark) {
  :root { --text: #F2F2EF; --muted: #A3A7AD; --faint: #6E7278; --bg: #0E0F0F; --surface: #1A1B1C; --accent: #8FBFAE; --line: rgba(242, 242, 239, 0.10); }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 680px; margin: 0 auto; padding: 48px 16px 80px; }
.brand { font-weight: 700; letter-spacing: -0.01em; color: var(--accent); text-decoration: none; }
h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -0.02em; margin: 24px 0 8px; }
h2 { font-size: 1.15rem; line-height: 1.3; margin: 32px 0 8px; }
p, li { color: var(--muted); }
p { margin: 0 0 12px; }
ul { margin: 0 0 12px; padding-left: 1.2em; }
li { margin-bottom: 6px; }
a { color: var(--accent); }
.updated { color: var(--faint); font-size: 0.9rem; margin: 0 0 20px; }
.intro { color: var(--text); }
nav { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
nav a { display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; font-weight: 600; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
<a class="brand" href="./">Pendura</a>
<h1>Boleias com quem faz o mesmo caminho.</h1>
<p class="intro">A Pendura liga pessoas que fazem o mesmo trajeto em Portugal, para partilharem custos e levarem encomendas.</p>
<nav>
<a href="termos/">Termos e Condições</a>
<a href="privacidade/">Política de Privacidade</a>
</nav>
</main>
</body>
</html>
